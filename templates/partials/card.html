<article class="card {% if v.is_watched() || v.is_skipped() %}card-dim{% endif %}" id="card-{{ v.video_id }}">
  <a class="thumb-wrap" href="{{ v.url }}" target="_blank" rel="noopener noreferrer" aria-label="Watch {{ v.title }}">
    <img
      class="thumb"
      src="{{ v.thumbnail_url() }}"
      alt=""
      loading="lazy"
      decoding="async"
      onerror="this.onerror=null;this.parentElement.classList.add('thumb-fallback');this.remove();"
    />
    {% if !v.duration.is_empty() %}
    <span class="duration">{{ v.duration }}</span>
    {% endif %}
    <span class="score">{{ v.importance_score }}</span>
  </a>

  <div class="card-body">
    <h2 class="title" dir="{{ v.text_dir() }}">
      <a href="{{ v.url }}" target="_blank" rel="noopener noreferrer">{{ v.title }}</a>
    </h2>
    <p class="channel" dir="{{ v.text_dir() }}">{{ v.display_channel() }}</p>

    <div class="tags">
      <span class="tag tag-cat">{{ v.category }}</span>
      {% if !v.subgenre.is_empty() %}
      <span class="tag tag-sub">{{ v.subgenre }}</span>
      {% endif %}
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="{{ v.url }}" target="_blank" rel="noopener noreferrer">Watch</a>
      <button
        type="button"
        class="btn btn-sm {% if v.is_watched() %}btn-active{% endif %}"
        hx-post="/videos/{{ v.video_id }}/action?kind=watched&tab={{ tab }}"
        hx-target="#card-{{ v.video_id }}"
        hx-swap="outerHTML"
      >{% if v.is_watched() %}Watched ✓{% else %}Watched{% endif %}</button>
      <button
        type="button"
        class="btn btn-sm {% if v.is_skipped() %}btn-warn{% endif %}"
        hx-post="/videos/{{ v.video_id }}/action?kind=skip&tab={{ tab }}"
        hx-target="#card-{{ v.video_id }}"
        hx-swap="outerHTML"
      >{% if v.is_skipped() %}Skipped{% else %}Skip{% endif %}</button>
      <button
        type="button"
        class="btn btn-sm {% if v.is_favorited() %}btn-fav{% endif %}"
        hx-post="/videos/{{ v.video_id }}/action?kind=favorite&tab={{ tab }}"
        hx-target="#card-{{ v.video_id }}"
        hx-swap="outerHTML"
        aria-label="Favorite"
      >{% if v.is_favorited() %}★ Favorited{% else %}☆ Favorite{% endif %}</button>
      <button
        type="button"
        class="btn btn-sm {% if v.is_in_queue() %}btn-active{% endif %}"
        hx-post="/videos/{{ v.video_id }}/action?kind=queue&tab={{ tab }}"
        hx-target="#card-{{ v.video_id }}"
        hx-swap="outerHTML"
      >{% if v.is_in_queue() %}Queued ✓{% else %}+ Queue{% endif %}</button>
    </div>
  </div>
</article>
