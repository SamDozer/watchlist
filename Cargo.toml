[package]
name = "watchlist"
version = "0.1.0"
edition = "2021"

[dependencies]
askama = "0.12"
axum = "0.8"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
