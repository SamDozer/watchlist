{% for v in videos %}
  {% include "partials/card.html" %}
{% endfor %}

{% if let Some(offset) = next_offset %}
<div class="load-more" id="load-more-row">
  <button
    type="button"
    class="btn"
    hx-get="/videos/partial?offset={{ offset }}"
    hx-include="#filter-form"
    hx-target="#load-more-row"
    hx-swap="outerHTML"
    hx-indicator="#more-loading"
  >
    Load more
  </button>
  <span id="more-loading" class="htmx-indicator loading-text">Loading...</span>
</div>
{% endif %}
