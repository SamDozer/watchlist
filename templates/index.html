<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchlist</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <a href="/" class="brand-link">Watchlist</a>
        <span class="total-badge">{{ counts.total }} total</span>
      </div>
      {% include "partials/nav.html" %}
    </div>
  </header>

  <main class="wrap">
    <section class="discover-bar">
      <button
        id="choose-btn"
        type="button"
        class="btn btn-choose"
        hx-post="/choose"
        hx-include="#filter-form"
        hx-target="#spotlight-slot"
        hx-swap="innerHTML"
        hx-indicator="#choose-loading"
      >
        Choose for me
      </button>
      <span id="choose-loading" class="htmx-indicator loading-text">Picking...</span>
    </section>

    <div id="spotlight-slot"></div>

    <form
      id="filter-form"
      class="filters"
      hx-get="/videos/partial"
      hx-target="#results-area"
      hx-swap="innerHTML"
      hx-trigger="input changed delay:250ms from:#q, change from:.filter-control"
      hx-indicator="#filter-loading"
    >
      <input type="hidden" name="tab" value="{{ tab }}" />

      <div class="search-row">
        <input
          id="q"
          name="q"
          type="search"
          value="{{ params.q }}"
          placeholder="Search titles, channels, categories, subgenres..."
          autocomplete="off"
        />
        <span id="filter-loading" class="htmx-indicator loading-text">Updating...</span>
        <a href="{% if tab == "all" %}/{% else %}/queue{% endif %}" class="btn btn-ghost">Reset</a>
      </div>

      <div class="time-pills" role="radiogroup" aria-label="Duration">
        <label class="time-pill">
          <input type="radio" name="bucket" value="" class="filter-control" {% if params.bucket.is_empty() %}checked{% endif %} />
          <span>Any time ({{ counts.unwatched }})</span>
        </label>
        <label class="time-pill">
          <input type="radio" name="bucket" value="Quick (<5m)" class="filter-control" {% if params.bucket == "Quick (<5m)" %}checked{% endif %} />
          <span>&lt; 5m ({{ buckets.quick }})</span>
        </label>
        <label class="time-pill">
          <input type="radio" name="bucket" value="Medium (5-20m)" class="filter-control" {% if params.bucket == "Medium (5-20m)" %}checked{% endif %} />
          <span>5–20m ({{ buckets.medium }})</span>
        </label>
        <label class="time-pill">
          <input type="radio" name="bucket" value="Deep Dive (20-60m)" class="filter-control" {% if params.bucket == "Deep Dive (20-60m)" %}checked{% endif %} />
          <span>20–60m ({{ buckets.deep_dive }})</span>
        </label>
        <label class="time-pill">
          <input type="radio" name="bucket" value="Long-Form (>60m)" class="filter-control" {% if params.bucket == "Long-Form (>60m)" %}checked{% endif %} />
          <span>60m+ ({{ buckets.long_form }})</span>
        </label>
      </div>

      <div class="filter-grid">
        <select id="category-select" name="category" class="filter-control" aria-label="Category">
          <option value="">All Categories ({{ counts.unwatched }})</option>
          {% for grp in category_groups %}
          <optgroup label="{{ grp.label }}">
            {% for cat in grp.items %}
            <option value="{{ cat.name }}" {% if params.category.as_str() == cat.name.as_str() %}selected{% endif %}>{{ cat.name }} ({{ cat.count }})</option>
            {% endfor %}
          </optgroup>
          {% endfor %}
        </select>

        <select id="subgenre-select" name="subgenre" class="filter-control" aria-label="Subgenre">
          {% let selected_subgenre = params.subgenre.clone() %}
          {% include "partials/subgenre_options.html" %}
        </select>

        <select name="language" class="filter-control" aria-label="Language">
          <option value="">All Languages</option>
          <option value="en" {% if params.language == "en" %}selected{% endif %}>English</option>
          <option value="ar" {% if params.language == "ar" %}selected{% endif %}>Arabic / Egyptian</option>
          <option value="de" {% if params.language == "de" %}selected{% endif %}>German</option>
        </select>

        <select name="short" class="filter-control" aria-label="Shorts filter">
          <option value="">Shorts &amp; Regular</option>
          <option value="0" {% if params.short == "0" %}selected{% endif %}>Exclude Shorts</option>
          <option value="1" {% if params.short == "1" %}selected{% endif %}>Shorts Only</option>
        </select>

        {% if tab == "all" %}
        <select name="status" class="filter-control" aria-label="Status">
          <option value="" {% if params.status.is_empty() %}selected{% endif %}>Unwatched ({{ counts.unwatched }})</option>
          <option value="all" {% if params.status == "all" %}selected{% endif %}>All ({{ counts.total }})</option>
          <option value="watched" {% if params.status == "watched" %}selected{% endif %}>Watched</option>
          <option value="skipped" {% if params.status == "skipped" %}selected{% endif %}>Skipped</option>
        </select>
        {% endif %}

        <label class="toggle-chip">
          <input type="checkbox" name="guitar" value="1" class="filter-control" {% if params.guitar == "1" %}checked{% endif %} />
          <span>Guitar only ({{ counts.guitar }})</span>
        </label>
      </div>
    </form>

    <section id="results-area">
      {% let include_subgenre_oob = false %}
      {% let selected_subgenre = params.subgenre.clone() %}
      {% include "partials/video_list.html" %}
    </section>
  </main>
</body>
</html>
